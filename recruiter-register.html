<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SmartRecruit | Recruiter Registration</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <div class="login-page">

        <div class="login-card register-card">


            <!-- LOGO -->

            <div class="logo">

                <span>Smart</span>Recruit

            </div>


            <!-- ROLE -->

            <div class="selected-role">

                👨‍💼

                <span>
                    Recruiter Registration
                </span>

            </div>


            <h1>Create Recruiter Account</h1>

            <p class="subtitle">

                Register your organization to start
                managing recruitment

            </p>


            <!-- FORM -->

            <form>


                <!-- RECRUITER NAME -->

                <div class="input-group">

                    <label>
                        Recruiter Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- COMPANY -->

                <div class="input-group">

                    <label>
                        Company Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter company name"
                        required>

                </div>


                <!-- DESIGNATION -->

                <div class="input-group">

                    <label>
                        Designation
                    </label>

                    <input
                        type="text"
                        placeholder="e.g. HR Manager"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Work Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your work email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="input-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create a password"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        placeholder="Confirm your password"
                        required>

                </div>


                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        required>

                    <span>

                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>

                    </span>

                </label>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-submit">

                    Create Recruiter Account →

                </button>


            </form>


            <!-- LOGIN -->

            <p class="register-text">

                Already have a recruiter account?

                <a href="recruiter-login.html">

                    Login

                </a>

            </p>


            <!-- BACK -->

            <a
                href="recruiter-login.html"
                class="back-link">

                ← Back to Recruiter Login

            </a>


        </div>

    </div>

</body>

</html>
