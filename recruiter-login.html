<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartRecruit | Recruiter Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="login-page">

        <div class="login-card">


            <!-- LOGO -->

            <div class="logo">
                <span>Smart</span>Recruit
            </div>


            <!-- ROLE -->

            <div class="selected-role">

                👨‍💼

                <span>Recruiter Login</span>

            </div>


            <h1>Welcome back!</h1>

            <p class="subtitle">
                Login to manage your recruitment process
            </p>


            <!-- LOGIN FORM -->

            <form action="recruiter-dashboard.html">


                <!-- EMAIL -->

                <div class="input-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- OPTIONS -->

                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-submit">

                    Login as Recruiter →

                </button>


            </form>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have a recruiter account?

                <a href="recruiter-register.html">
                    Create one
                </a>

            </p>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link">

                ← Back to role selection

            </a>


        </div>

    </div>

</body>

</html>
