<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartRecruit | Admin Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">
            <span>Smart</span>Recruit
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Sign in to manage the recruitment system
        </p>


        <div class="selected-role">
            🛡️
            <span>Administrator</span>
        </div>


        <form action="admin-dashboard.html">

            <div class="input-group">

                <label>Admin Email</label>

                <input
                    type="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-submit"
            >
                Login as Admin
            </button>

        </form>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Role Selection
        </a>

    </div>

</div>

</body>

</html>
